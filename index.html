<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f7f5">
<meta name="description" content="云庭中心 A 座楼宇三维运维原型：楼层拆解、单层查看、设备定位与告警工单联动。原生 WebGL 2，模拟数据。">
<title>云庭中心 A 座 · 楼宇三维运维</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
<script defer src="js/math.js"></script>
<script defer src="js/renderer.js"></script>
<script defer src="js/model.js"></script>
<script defer src="js/data.js"></script>
<script defer src="js/app.js"></script>
</head>
<body>
<header class="topbar">
 <a class="project" href="#" id="home" title="回到外观视图 · 0">
  <strong>云庭中心 A 座</strong>
  <span>6 层办公楼 · 1,980 m² · 模拟数据</span>
 </a>
 <div class="readouts" aria-label="楼宇运行读数">
  <button class="readout" id="stat-devices" title="查看全部设备"><span>设备在线</span><b id="r-online">35/36</b></button>
  <button class="readout" id="stat-alarms" title="查看活动告警"><span>告警</span><b id="r-alarms">1</b></button>
  <button class="readout" id="stat-orders" title="查看运维工单"><span>工单</span><b id="r-orders">0</b></button>
  <button class="readout" id="stat-energy" title="查看用电概况"><span>今日用电</span><b>1,248.6<small>kWh</small></b></button>
 </div>
 <div class="tools">
  <button class="tool" id="quality-toggle" aria-pressed="true" title="切换精细 / 流畅画质">画质：精细</button>
  <button class="tool" id="capture" title="导出当前三维画面 PNG">导出图片</button>
  <button class="tool" id="presentation" title="隐藏界面，只看模型 · P">演示</button>
 </div>
</header>

<nav class="sidebar" aria-label="视图与楼层">
 <div class="side-group">
  <h2>视图</h2>
  <div class="mode-switch">
   <button data-mode="overview" class="active" title="建筑外观 · 0">外观</button>
   <button data-mode="explode" title="逐层拆开 · E">拆解</button>
  </div>
 </div>
 <div class="side-group">
  <h2>楼层</h2>
  <div id="floor-buttons" class="floor-list"></div>
 </div>
 <div class="side-group side-toggles">
  <button class="check active" id="devices-toggle" aria-pressed="true"><i></i>设备点位</button>
  <button class="check" id="night-toggle" aria-pressed="false" title="D"><i></i>夜间照明</button>
  <button class="check" id="orbit-toggle" aria-pressed="false"><i></i>自动环绕</button>
 </div>
 <div class="legend" aria-label="点位状态"><span><i class="st-normal"></i>正常</span><span><i class="st-alarm"></i>告警</span><span><i class="st-offline"></i>离线</span></div>
 <p class="keys">1–6 楼层　E 拆解　D 夜间<br>R 复位视角　P 演示</p>
</nav>

<main id="viewport" class="viewport" aria-label="三维楼宇场景">
 <canvas id="scene" tabindex="0" aria-label="拖动旋转，滚轮缩放，数字键 1 至 6 查看楼层"></canvas>
 <div id="pins" class="pins"></div>
 <div id="floor-tags" class="floor-tags"></div>
 <p class="view-title" id="view-title">外观</p>
 <div class="view-bar">
  <span class="compass" title="指北"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2 14 17 10 14 6 17Z"/></svg>北</span>
  <nav class="view-presets" id="view-presets" aria-label="观察角度"></nav>
  <button class="tool" id="reset-view" title="R">复位</button>
 </div>
</main>

<aside class="panel" id="panel" aria-label="运维信息"></aside>

<div id="toast" role="status" aria-live="polite"></div>
<div id="loading" class="loading">正在生成楼宇模型</div>
<div id="error" class="error-screen" hidden>
 <h1>三维场景没有启动</h1>
 <p id="error-text"></p>
 <p>请使用桌面版 Chrome 或 Edge，并在浏览器设置里打开图形加速。</p>
 <button onclick="location.reload()">重新加载</button>
</div>
<button id="exit-presentation" class="tool">退出演示 · P</button>
</body>
</html>
