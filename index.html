    const spaces=[{target:[4.6,1.1,1.5],yaw:.62},{target:[4.1,1.15,.3],yaw:.60},{target:[4.0,1.15,-2.1],yaw:.60},{target:[4.3,1.15,.8],yaw:.55},{target:[3.8,1.25,-1.1],yaw:.52},{target:[3.6,1.55,-.15],yaw:.55}];
    const pose=spaces[state.floor];goal={yaw:pose.yaw,pitch:.73,span:narrow?23:13.5,target:pose.target};
   }
  }else if(state.mode==='explode'){
   if(id==='front')goal={yaw:0,pitch:.17,span:narrow?64:54,target:[0,21.0,0]};
   if(id==='back')goal={yaw:3.86,pitch:.38,span:narrow?65:59,target:[0,20.8,0]};
  }
 }
 cam.goal=goal;if(reduced){cam.yaw=goal.yaw;cam.pitch=goal.pitch;cam.span=goal.span;cam.target=[...goal.target]}
}

function cameraButtons(){
 const list=state.mode==='overview'?[['hero','总览'],['front','正面'],['back','背面'],['roof','屋顶']]:state.mode==='floor'?[['hero','斜视'],['top','俯视'],['reverse','反向'],['detail','近景']]:[['hero','斜视'],['front','正视'],['back','背面']];
 $('#view-presets').innerHTML=list.map(([id,name])=>`<button data-view="${id}" class="${(state.cameraPreset||'hero')===id?'active':''}" aria-pressed="${(state.cameraPreset||'hero')===id}" title="${name}观察视角">${name}</button>`).join('');
}
function setCameraPreset(id){
 const allowed=state.mode==='overview'?['hero','front','back','roof']:state.mode==='floor'?['hero','top','reverse','detail']:['hero','front','back'];
 if(!allowed.includes(id))return;state.cameraPreset=id==='hero'?null:id;state.auto=false;$('#orbit-toggle').classList.remove('active');$('#orbit-toggle').setAttribute('aria-pressed','false');targetCamera();cameraButtons();
}
function setQuality(quality){
 state.quality=quality==='balanced'?'balanced':'detail';renderer.quality=state.quality==='detail'?1.5:1;renderer.ao=state.quality==='detail'?1:0;renderer.shadowDirty=true;
 $('#quality-toggle').textContent=state.quality==='detail'?'精细画质':'流畅画质';$('#quality-toggle').setAttribute('aria-pressed',String(state.quality==='detail'));$('#quality-toggle').setAttribute('aria-label','画质：'+(state.quality==='detail'?'精细':'流畅'));
}

function setMode(mode,floorIndex=state.floor,{keepSelection=false}={}){if(!['overview','explode','floor'].includes(mode))return;state.mode=mode;state.cameraPreset=null;state.floor=M.clamp(Number(floorIndex)||0,0,5);state.auto=false;$('#orbit-toggle').classList.remove('active');$('#orbit-toggle').setAttribute('aria-pressed','false');splitGoal=mode==='explode'?1:0;if(!keepSelection){state.selected=null;state.panel=mode==='floor'?'floor':'overview'}renderer.shadowDirty=true;targetCamera();sceneButtons();cameraButtons();buildPins();renderPanel()}
function selectDevice(id){const d=store.get(id);if(!d)return;state.selected=id;state.panel='device';setMode('floor',d.floor,{keepSelection:true});state.markers=true;$('#devices-toggle').classList.add('active');$('#devices-toggle').setAttribute('aria-pressed','true');buildPins();renderer.shadowDirty=true;panel.scrollTop=0}
function buildPins(){const ds=state.mode==='floor'?store.devices.filter(d=>d.floor===state.floor):state.mode==='explode'?store.devices.filter(d=>d.status==='alert'):store.devices.filter(d=>(d.type==='hvac'&&d.floor===2&&d.status==='alert')||(d.type==='camera'&&d.floor===0)||(d.type==='smoke'&&d.status==='alert'));
 $('#pins').innerHTML=ds.map(d=>`<button class="device-pin ${d.status==='alert'?'alarm':''} ${!d.online?'offline':''} ${d.id===state.selected?'selected':''}" data-pin="${d.id}" title="${d.floor+1}F · ${d.name} · ${badge(d)}" aria-label="${d.floor+1}楼${d.name}${badge(d)}"><span class="pin-icon">${icon(Twin.types[d.type].icon)}</span>${d.id===state.selected||d.status==='alert'?`<span class="pin-label">${d.floor+1}F · ${d.type==='smoke'&&d.status==='alert'?'烟感告警':d.type==='hvac'&&d.status==='alert'?'空调异常':d.name}</span>`:''}</button>`).join('');
 $('#floor-tags').innerHTML=state.mode==='explode'?Twin.floors.map((f,i)=>`<button class="floor-tag" data-floor-tag="${i}"><b>${f.number}F</b>${f.name}</button>`).join(''):'';
}
function offsetForFloor(f){if(state.mode==='floor')return [0,.49-(.91+f*3.7),0];return [0,f*3.2*split,0]}
function worldPosition(d){const base=.91+d.floor*3.7,off=offsetForFloor(d.floor);let p=[d.position[0],d.position[1]+base+off[1],d.position[2]];if(state.mode==='overview'&&d.status==='alert')p=[11.1,base+2.0,5.6];return p}
function updatePins(){const rect=canvas.getBoundingClientRect();for(const el of $$('[data-pin]')){const d=store.get(el.dataset.pin),p=renderer.project(worldPosition(d),cam);const inside=state.markers&&p.x>15&&p.x<rect.width-15&&p.y>30&&p.y<rect.height-15;el.classList.toggle('hidden',!inside);if(inside){el.style.left=`${p.x}px`;el.style.top=`${p.y-12}px`;el.style.zIndex=d.id===state.selected?'8':d.status==='alert'?'6':'3'}}for(const el of $$('[data-floor-tag]')){const i=Number(el.dataset.floorTag),p=renderer.project([-11.7,.91+i*3.7+i*3.2*split+.2,7.9],cam);el.style.left=`${p.x-17}px`;el.style.top=`${p.y}px`;el.style.display=p.x>50&&p.y>10&&p.y<rect.height-10?'flex':'none'}$('.compass svg').style.transform=`rotate(${cam.yaw*180/Math.PI}deg)`}
function visible(b){if(b.detail&&state.mode==='overview'&&cam.span>30)return false;if(b.floor===-4)return true;if(b.floor===-3)return state.mode==='floor';if(b.floor===-1)return state.mode!=='floor'&&(b.kind!=='exterior'||state.mode==='overview');if(b.floor===6)return state.mode!=='floor';if(state.mode==='floor'&&b.floor!==state.floor)return false;if(b.kind==='stair-upper'&&state.mode==='floor')return false;if(b.kind==='shell')return state.mode==='overview';if(b.kind==='selection')return state.mode==='floor'&&!!state.selected&&store.get(state.selected)?.floor===b.floor;if(b.kind==='smokeAlarm')return state.mode!=='overview'&&store.devices.some(d=>d.floor===b.floor&&d.type==='smoke'&&d.status==='alert');if(b.kind==='alarm'){const d=store.devices.find(d=>d.floor===b.floor&&d.status==='alert'&&d.type==='hvac');return !!d&&state.mode!=='overview'}return true}
function offsets(b){if(b.floor<0)return [0,0,0];const off=offsetForFloor(b.floor);if(b.kind==='selection'&&state.selected){const d=store.get(state.selected);off[0]=d.position[0];off[2]=d.position[2]}return off}
function toggleNight(){state.night=!state.night;document.body.classList.toggle('night',state.night);$('#night-toggle').classList.toggle('active',state.night);$('#night-toggle').setAttribute('aria-pressed',String(state.night));$('#night-toggle').innerHTML=icon(state.night?'moon':'sun')}
function togglePresentation(){state.presentation=!state.presentation;document.body.classList.toggle('presentation',state.presentation);targetCamera();toast(state.presentation?'作品模式 · 按 P 恢复操作面板':'已恢复运维界面')}
function makeScreenshot(){try{const out=document.createElement('canvas'),w=1920,h=Math.round(1920*canvas.height/canvas.width)+145;out.width=w;out.height=h;const c=out.getContext('2d');c.fillStyle=state.night?'#172b30':'#e8eeeb';c.fillRect(0,0,w,h);c.drawImage(canvas,0,89,w,h-145);c.fillStyle=state.night?'#d9e1d0':'#233f3a';c.font='500 27px "Segoe UI","Microsoft YaHei",sans-serif';c.fillText('LAILIN  /  来霖 · 智慧楼宇',45,52);c.font='16px "Segoe UI","Microsoft YaHei",sans-serif';c.textAlign='right';c.fillText(`${state.mode==='floor'?Twin.floors[state.floor].number+'F · '+Twin.floors[state.floor].name:state.mode==='explode'?'楼层拆解':'云庭中心 · A 座'}`,w-45,50);const s=store.stats();c.textAlign='left';c.font='14px "Segoe UI","Microsoft YaHei",sans-serif';c.fillStyle='#879782';c.fillText(`WebGL 2 · 实时三维场景     在线率 ${s.rate}%     能耗 1,248.6 kWh     告警 ${s.alarms}     工单 ${s.orders}`,45,h-23);c.textAlign='right';c.fillText('SIMULATED DATA / PORTFOLIO CASE',w-45,h-23);out.toBlob(blob=>{if(!blob)return toast('截图导出失败');const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=`LAILIN-${state.mode}${state.mode==='floor'?'-'+(state.floor+1)+'F':''}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('已导出当前 3D 场景 PNG')},'image/png')}catch(e){toast('截图失败：'+e.message)}}
function onPanelClick(e){const el=e.target.closest('button');if(!el)return;
 if(el.dataset.device)return selectDevice(el.dataset.device);
 if(el.dataset.focus){const d=store.get(el.dataset.focus);targetCamera(d);toast('已聚焦设备，拖拽可查看周边空间');return}
 if(el.dataset.order){const {order,existing}=store.createOrder(el.dataset.order);renderPanel();toast(existing?`${order.id} 已在处理中，无需重复创建`:`已创建 ${order.id}，设备与工单已关联`);return}
 if(el.dataset.complete){store.completeOrder(el.dataset.complete);renderPanel();buildPins();renderer.shadowDirty=true;toast('检修已完成，告警与设备状态已同步复位');return}
 if(el.dataset.filter){state.filter=el.dataset.filter;state.panel='devices';renderPanel();return}
 switch(el.dataset.action){
 case 'back':state.selected=null;state.panel=state.mode==='floor'?'floor':'overview';renderPanel();buildPins();break;
 case 'floor-panel':state.panel='floor';state.selected=null;renderPanel();buildPins();break;
 case 'simulate':{const {device,existing}=store.simulate();selectDevice(device.id);toast(existing?'该烟感告警已触发，已定位现有事件':'已触发 2F 烟感模拟告警，并定位到设备');break}
 case 'reset-demo':if(confirm('复位本地演示？将清除本机工单记录并恢复初始模拟告警。')){store.reset();setMode('overview');toast('已恢复初始演示数据')}break;
 }
}
function setupInteraction(){
 $('#floor-buttons').innerHTML=Twin.floors.map((f,i)=>`<button class="floor-chip" data-floor="${i}" title="查看 ${f.number}F ${f.name}" aria-label="查看${f.number}楼${f.name}"><b>${f.number}F</b><small>${f.short}</small></button>`).join('');
 $$('.floor-chip[data-floor]').forEach(b=>b.addEventListener('click',()=>setMode('floor',Number(b.dataset.floor))));
 $$('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
 $('#floor-all').addEventListener('click',()=>setMode('overview'));$('.brand').addEventListener('click',e=>{e.preventDefault();setMode('overview')});
 $('#reset-view').addEventListener('click',()=>{setCameraPreset('hero');toast('已恢复当前模式的默认视角')});
 $('#view-presets').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)setCameraPreset(b.dataset.view)});
 $('#quality-toggle').addEventListener('click',()=>{setQuality(state.quality==='detail'?'balanced':'detail');toast(state.quality==='detail'?'精细画质：超采样与接触阴影':'流畅画质：降低渲染分辨率，关闭接触阴影')});
 $('#night-toggle').addEventListener('click',toggleNight);$('#devices-toggle').addEventListener('click',()=>{state.markers=!state.markers;$('#devices-toggle').classList.toggle('active',state.markers);$('#devices-toggle').setAttribute('aria-pressed',String(state.markers));updatePins();toast(state.markers?'设备点位已显示':'设备点位已隐藏')});
 $('#orbit-toggle').addEventListener('click',()=>{state.auto=!state.auto;$('#orbit-toggle').classList.toggle('active',state.auto);$('#orbit-toggle').setAttribute('aria-pressed',String(state.auto))});
 $('#presentation').addEventListener('click',togglePresentation);$('#exit-presentation').addEventListener('click',togglePresentation);$('#capture').addEventListener('click',makeScreenshot);
 $('#stat-devices').addEventListener('click',()=>{state.panel='devices';state.filter='all';renderPanel();panel.scrollTop=0});$('#stat-energy').addEventListener('click',()=>{state.panel='overview';renderPanel();panel.scrollTop=0});$('#stat-alarms').addEventListener('click',()=>{state.panel='devices';state.filter='alert';renderPanel();panel.scrollTop=0});$('#stat-orders').addEventListener('click',()=>{state.panel='orders';renderPanel();panel.scrollTop=0});
 panel.addEventListener('click',onPanelClick);$('#pins').addEventListener('click',e=>{const b=e.target.closest('[data-pin]');if(b)selectDevice(b.dataset.pin)});$('#floor-tags').addEventListener('click',e=>{const b=e.target.closest('[data-floor-tag]');if(b)setMode('floor',Number(b.dataset.floorTag))});
 let down=null,pointers=new Map(),pinch=0;
 canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);down={x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,moved:false};canvas.classList.add('dragging');if(pointers.size===2){const p=[...pointers.values()];pinch=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1])}});
 canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId)||!down)return;pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===2){const p=[...pointers.values()],d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);if(pinch>0)cam.goal.span=M.clamp(cam.goal.span*pinch/d,12,85);pinch=d;down.moved=true;return}const dx=e.clientX-down.lastX,dy=e.clientY-down.lastY;cam.goal.yaw-=dx*.006;cam.goal.pitch=M.clamp(cam.goal.pitch+dy*.005,.18,1.42);down.lastX=e.clientX;down.lastY=e.clientY;if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>4)down.moved=true;state.auto=false;$('#orbit-toggle').classList.remove('active');$('#orbit-toggle').setAttribute('aria-pressed','false')});
 const release=e=>{pointers.delete(e.pointerId);if(down&&!down.moved&&e.type==='pointerup'){const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;let best=null,min=23;for(const el of $$('[data-pin]:not(.hidden)')){const d=store.get(el.dataset.pin),p=renderer.project(worldPosition(d),cam),dist=Math.hypot(p.x-x,p.y-y);if(dist<min){min=dist;best=d}}if(best)selectDevice(best.id)}if(!pointers.size){down=null;canvas.classList.remove('dragging')}else{const p=[...pointers.values()][0];down={x:p[0],y:p[1],lastX:p[0],lastY:p[1],moved:true}}};
 canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('wheel',e=>{e.preventDefault();cam.goal.span=M.clamp(cam.goal.span*Math.exp(e.deltaY*.001),12,85)},{passive:false});canvas.addEventListener('contextmenu',e=>e.preventDefault());
 window.addEventListener('keydown',e=>{if(e.ctrlKey||e.altKey||e.metaKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const key=e.key.toLowerCase();if(/^[1-6]$/.test(key)){e.preventDefault();setMode('floor',Number(key)-1)}else if(key==='0')setMode('overview');else if(key==='e')setMode('explode');else if(key==='r')setCameraPreset('hero');else if(key==='d')toggleNight();else if(key==='p')togglePresentation();else if(key==='escape'){if(state.presentation)togglePresentation();else{state.selected=null;state.panel=state.mode==='floor'?'floor':'overview';renderPanel();buildPins()}}});
 window.addEventListener('resize',()=>{targetCamera();renderer.shadowDirty=true});
 canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();$('#error').hidden=false;$('#error-text').textContent='图形上下文已丢失。保存的演示工单不受影响，请重新加载页面。'});
 canvas.addEventListener('webglcontextrestored',()=>location.reload());
}
function frame(now){
 requestAnimationFrame(frame);const clockDt=Math.min((now-(frame.clock||now))/1000,.12);frame.clock=now;if(document.hidden)return;
 // Animation time is independent of GPU submission cadence.
 if(state.auto)cam.goal.yaw+=clockDt*.085;
 if(!renderer.frameReady())return;const moving=Math.abs(cam.yaw-cam.goal.yaw)+Math.abs(cam.pitch-cam.goal.pitch)+Math.abs(cam.span-cam.goal.span)+cam.target.reduce((sum,v,i)=>sum+Math.abs(v-cam.goal.target[i]),0)+Math.abs(split-splitGoal)+Math.abs(nightMix-(state.night?1:0))>.0005;if(!firstFrame&&!moving&&!state.auto&&!renderer.shadowDirty&&now-(renderer.lastComplete||last)<1200){updatePins();return}if(last&&now-last<29)return;const dt=Math.min((now-last)/1000||.033,.5);last=now;state.tick=now/1000;
 frameCount++;frameTime+=(frame.lastNow?(now-frame.lastNow)/1000:dt);frame.lastNow=now;if(frameTime>=2){fps=frameCount/frameTime;frameCount=0;frameTime=0}
 const a=reduced?1:1-Math.exp(-dt*6.8);cam.yaw=M.lerp(cam.yaw,cam.goal.yaw,a);cam.pitch=M.lerp(cam.pitch,cam.goal.pitch,a);cam.span=M.lerp(cam.span,cam.goal.span,a);cam.target=cam.target.map((v,i)=>M.lerp(v,cam.goal.target[i],a));
 const prev=split;split=M.lerp(split,splitGoal,a);if(Math.abs(split-splitGoal)<.001)split=splitGoal;if(Math.abs(split-prev)>.0003)renderer.shadowDirty=true;nightMix=M.lerp(nightMix,state.night?1:0,a);
 const size=renderer.resize(),aspect=size[0]/Math.max(size[1],1),r=85;
 cam.eye=[cam.target[0]+r*Math.cos(cam.pitch)*Math.sin(cam.yaw),cam.target[1]+r*Math.sin(cam.pitch),cam.target[2]+r*Math.cos(cam.pitch)*Math.cos(cam.yaw)];cam.vp=M.mul(M.ortho(-cam.span*aspect/2,cam.span*aspect/2,-cam.span/2,cam.span/2,.1,260),M.lookAt(cam.eye,cam.target));
 const lightBg=[.910,.933,.921],darkBg=[.090,.169,.188];const sceneState={visible,offset:offsets,tint:b=>b.kind==='equipment'&&state.selected&&store.get(state.selected)?.floor===b.floor&&store.get(state.selected)?.status==='alert'?.15:0,night:nightMix,background:lightBg.map((v,i)=>M.lerp(v,darkBg[i],nightMix))};
 const farLOD=state.mode==='overview'&&cam.span>30;if(renderer.farLOD!==farLOD){renderer.farLOD=farLOD;renderer.shadowDirty=true;}
 renderer.draw(sceneState,cam,state.tick);renderer.lastState={mode:state.mode,floor:state.floor,split,night:nightMix,selected:state.selected};updatePins();
 if(firstFrame){firstFrame=false;$('#loading').classList.add('gone');window.__TWIN_READY__=true;setTimeout(()=>$('#loading').remove(),600)}
}
function main(){try{store=new Twin.Store();renderer=new Twin.Renderer(canvas);model=Twin.buildModel();renderer.load(model.items);setupInteraction();renderPanel();sceneButtons();cameraButtons();buildPins();targetCamera();requestAnimationFrame(frame);
 setInterval(()=>{$('#clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false});if(state.selected&&$('#device-reading'))$('#device-reading').textContent=store.unitValue(store.get(state.selected),state.tick)},5000);$('#clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false});
 window.twinApp={state,store,camera:cam,setMode,selectDevice,setCameraPreset,setQuality,renderer,model,diagnostics:()=>({...renderer.diagnostics(),fps:Number(fps.toFixed(1)),renderPolicy:'on-demand + 1.2s idle refresh',cameraPreset:state.cameraPreset||'hero',quality:state.quality,mode:state.mode,selected:state.selected,split:Number(split.toFixed(3)),nightMix:Number(nightMix.toFixed(3)),storageAvailable:store.storageAvailable}),projectDevice:id=>renderer.project(worldPosition(store.get(id)),cam)};
 }catch(error){console.error(error);$('#loading')?.remove();$('#error').hidden=false;$('#error-text').textContent=error.message;window.__TWIN_ERROR__=error.message}}
 setTimeout(main,40);
})();
